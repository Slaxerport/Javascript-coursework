<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="logstyle.css">
</head>
<body>
    <div id="main-container">
        <div id="form">
            <h1>Регистрация</h1>
            <input type="text" placeholder="Создайте логин" id = "login">
            <div id = "container">
                <input type="password" placeholder="Введите пароль" id = "password">
                <button id="password-visibility" onclick = "changePasswordVisibility()">
                    <div id="visibility" data-visible>
                        <img src="../images/hide.png" alt="">
                    </div>
                </button>
            </div>
            <button id = "action-button" onclick = "registration()">Зарегистрироваться</button>
            <button type = "button" onclick = "location.href='main-page.html'" id = "back-button"><span>←</span> <span>Вернуться на главную страницу</span></button>
        </div>
    </div>
    
    <script type="text/javascript" src = "registration.js"></script>
</body>
</html>
